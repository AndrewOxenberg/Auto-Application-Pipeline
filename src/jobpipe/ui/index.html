<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yield Sheet — job pipeline</title>
<style>
:root{
  --ground:#dee2e8; --panel:#f4f6f8; --panel-2:#fbfcfd; --panel-3:#e8ecf1;
  --ink:#14171c; --ink-2:#4e5765; --ink-3:#616a77;
  --rule:#c2c9d2; --rule-2:#d9dee4;
  --gold:#e0a200; --gold-2:#c88f00; --gold-ink:#2a2000;
  --sel:#1f52c9; --sel-wash:#dbe4fa;
  --bin-pass:#17914c; --bin-title:#c0490c; --bin-location:#1f52c9;
  --bin-experience:#6d3ad4; --bin-phrase:#bb1240; --bin-grad:#0b7a8f;
  --bin-stale:#8a6008; --bin-ghost:#94198c; --bin-unbinned:#6b7480;
  --bin-internship:#0f766e; --bin-references:#9a3412;
  --shadow:0 1px 2px rgba(20,23,28,.08), 0 6px 16px -8px rgba(20,23,28,.22);
  --font-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --font-mono:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  --fs-data:0.8125rem; --fs-label:0.6875rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#101116; --panel:#191b21; --panel-2:#1f222a; --panel-3:#23262f;
    --ink:#e7eaef; --ink-2:#a9b2bf; --ink-3:#828b98;
    --rule:#333844; --rule-2:#282c35;
    --gold:#f0b62a; --gold-2:#d9a11c; --gold-ink:#241a00;
    --sel:#6f9bff; --sel-wash:#1d2740;
    --bin-pass:#3ec27a; --bin-title:#f2803c; --bin-location:#6f9bff;
    --bin-experience:#a97cf5; --bin-phrase:#f2547d; --bin-grad:#35b7cf;
    --bin-stale:#d3a12c; --bin-ghost:#dd6bd4; --bin-unbinned:#8b93a1;
    --bin-internship:#2dd4bf; --bin-references:#fb923c;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px -10px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:var(--fs-data); line-height:1.45;
  -webkit-font-smoothing:antialiased;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--sel)}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lbl{
  font-family:var(--font-mono); font-size:var(--fs-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
}

/* ---------- lot header ---------- */
.lot{
  background:var(--panel); border-bottom:1px solid var(--rule);
  padding:14px 20px 0; flex:0 0 auto;
}
.lot-top{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}
.lot-id{font-family:var(--font-mono);font-size:1.25rem;letter-spacing:-.015em;font-weight:600}
.lot-id span{color:var(--ink-3);font-weight:400}
.runbtn{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px;
  border:1px solid var(--rule);border-radius:3px;background:var(--panel-2);
  font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2);white-space:nowrap;
  transition:background 140ms ease,color 140ms ease;
}
.runbtn:hover:not(:disabled){background:var(--panel-3);color:var(--ink)}
.runbtn:disabled{cursor:default;color:var(--ink-3);border-color:var(--rule-2)}
.runbtn.busy svg{animation:spin 1.1s linear infinite;color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
#poll-status{white-space:nowrap;font-variant-numeric:tabular-nums}
#poll-status.done{color:var(--bin-pass)}
#poll-status.bad{color:var(--bin-phrase)}

.readout{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.readout div{text-align:right}
.readout b{
  display:block;font-family:var(--font-mono);font-size:1.5rem;
  font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;
  letter-spacing:-.02em;
}
.readout .yield b{color:var(--bin-pass)}

.map-row{display:flex;gap:20px;align-items:flex-end;padding:12px 0 0}
.map-wrap{flex:1 1 auto;min-width:0}
#diemap{display:block;width:100%;height:76px;cursor:crosshair;image-rendering:pixelated}
.map-cap{display:flex;justify-content:space-between;padding-top:5px}

/* ---------- bin legend / filters ---------- */
.bins{display:flex;gap:0;flex-wrap:wrap;padding:10px 0 0;margin-bottom:-1px}
.bin{
  display:flex;align-items:baseline;gap:7px;padding:7px 12px 8px;
  border:1px solid transparent;border-bottom-color:var(--rule);
  background:none;white-space:nowrap;transition:background 140ms ease;
}
.bin:hover{background:var(--panel-3)}
.bin[aria-pressed="true"]{
  background:var(--panel-2);border-color:var(--rule);
  border-bottom-color:var(--panel-2);border-radius:3px 3px 0 0;
}
.chip{width:9px;height:9px;flex:0 0 9px;border-radius:1px;transform:translateY(1px)}
/* Triage tabs are a different taxonomy from the reject bins and must not read
   as one of them, so the chip is an outline and the bin palette is untouched. */
.bin[data-kind="triage"] .chip{background:none;border:1px solid var(--ink-3)}
.bin-sep{
  width:1px;align-self:stretch;margin:6px 9px 9px;
  background:var(--rule);flex:0 0 1px;
}
.bin-n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bin[aria-pressed="true"] .bin-n{color:var(--ink);font-weight:600}
.bin-l{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.07em;color:var(--ink-3)}
.bin[aria-pressed="true"] .bin-l{color:var(--ink-2)}

/* ---------- alert strip ---------- */
.alerts{
  display:flex;align-items:center;gap:10px;padding:8px 20px;
  background:color-mix(in srgb,var(--bin-phrase) 11%,var(--panel));
  border-bottom:1px solid color-mix(in srgb,var(--bin-phrase) 32%,var(--rule));
  color:var(--ink);flex:0 0 auto;
}
.alerts svg{flex:0 0 auto;color:var(--bin-phrase)}
.alerts b{font-weight:600}
.alerts .sites{font-family:var(--font-mono);color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.alerts button{margin-left:auto;color:var(--ink-2);text-decoration:underline;
  text-underline-offset:3px;flex:0 0 auto}
.alerts button:hover{color:var(--ink)}

/* ---------- workspace ---------- */
.work{flex:1 1 auto;display:grid;grid-template-columns:minmax(420px,1.05fr) minmax(400px,1fr);min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col+.col{border-left:1px solid var(--rule)}

.toolbar{
  display:flex;gap:8px;align-items:center;padding:10px 14px;
  background:var(--panel);border-bottom:1px solid var(--rule);flex:0 0 auto;
}
.search{position:relative;flex:1 1 auto;min-width:0}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{
  width:100%;padding:6px 10px 6px 30px;background:var(--panel-2);
  border:1px solid var(--rule);border-radius:3px;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--sel);outline:none;box-shadow:0 0 0 3px var(--sel-wash)}
.toggle{
  padding:6px 11px;border:1px solid var(--rule);border-radius:3px;
  background:var(--panel-2);font-family:var(--font-mono);
  font-size:var(--fs-label);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-2);white-space:nowrap;transition:background 140ms ease;
}
.toggle:hover{background:var(--panel-3)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
select.toggle{padding-right:6px;cursor:pointer}

.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;background:var(--panel-2)}

/* ---------- die table ---------- */
table{width:100%;border-collapse:collapse}
thead th{
  position:sticky;top:0;z-index:2;background:var(--panel);
  text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);
  font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;
}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
/* The column header is the sort control, the same way the bin legend is the
   bin filter. Inherits the header's own type so it reads as a header first. */
.sortbtn{
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
  background:none;border:0;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  transition:color 140ms;
}
.sortbtn:hover{color:var(--ink)}
.sortbtn::after{content:"\2195";opacity:.35;font-size:11px}
.sortbtn[aria-pressed="true"]{color:var(--ink)}
.sortbtn[aria-pressed="true"]::after{content:"\2193";opacity:1}
.sortbtn:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
tbody tr{border-bottom:1px solid var(--rule-2);cursor:pointer}
tbody tr:hover{background:var(--panel-3)}
tbody tr[aria-selected="true"]{background:var(--sel-wash)}
tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--sel)}
td{padding:7px 10px;vertical-align:top}
td.co{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ti{color:var(--ink-2)}
td.ti .t{color:var(--ink);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
td.ti .l{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:34ch}
td.age{font-family:var(--font-mono);color:var(--ink-2);white-space:nowrap}
.flags{display:flex;gap:4px;justify-content:flex-end}
.flag{
  font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.05em;
  padding:1px 5px;border-radius:2px;border:1px solid;white-space:nowrap;
}
.flag.new{color:var(--bin-pass);border-color:color-mix(in srgb,var(--bin-pass) 45%,transparent)}
.flag.ghost{color:var(--bin-ghost);border-color:color-mix(in srgb,var(--bin-ghost) 45%,transparent)}
.flag.short{color:var(--gold-2);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.flag.sub{color:var(--panel);background:var(--ink);border-color:var(--ink)}
.flag.dis{color:var(--ink-3);border-color:var(--rule)}
tr.dismissed td.co,tr.dismissed td.ti .t{color:var(--ink-3);font-weight:400}

/* ---------- detail ---------- */
.detail{padding:0 0 40px}
.detail-head{padding:16px 18px 14px;border-bottom:1px solid var(--rule);background:var(--panel-2)}
.detail-head h1{font-size:1.25rem;line-height:1.3;font-weight:600;letter-spacing:-.015em}
.detail-head .co{font-family:var(--font-mono);color:var(--ink-2);padding-bottom:3px}
.meta{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:11px 22px;padding:14px 0 2px;
}
.meta div{display:flex;flex-direction:column;gap:1px;min-width:0}
.meta .lbl{line-height:1.3}
.meta .v{font-family:var(--font-mono);color:var(--ink);
  overflow-wrap:break-word;line-height:1.35}

.acts{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--rule);
  flex-wrap:wrap;align-items:center;background:var(--panel)}
.act{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;
  border:1px solid var(--rule);border-radius:3px;background:var(--panel-2);
  font-weight:500;transition:background 140ms ease,border-color 140ms ease;
}
.act:hover{background:var(--panel-3)}
.act[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.act.go{background:var(--gold);border-color:var(--gold-2);color:var(--gold-ink);font-weight:600}
.act.go:hover{background:var(--gold-2)}
.act.autoapply{border-color:var(--sel);color:var(--sel);font-weight:600}
.act.autoapply:hover{background:var(--sel-wash)}

/* ---------- fill packet ---------- */
.packet{border-bottom:1px solid var(--rule);background:var(--panel)}
.packet-head{display:flex;align-items:center;gap:12px;padding:12px 18px 8px;flex-wrap:wrap}
.packet-head h2{font-size:0.9375rem;font-weight:600}
.packet-head .tally{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.packet-head .tally span{font-family:var(--font-mono);font-size:var(--fs-label);
  letter-spacing:.06em}
.t-filled{color:var(--bin-pass)} .t-open{color:var(--bin-stale)}
.t-skip{color:var(--ink-3)} .t-review{color:var(--bin-phrase)}
.nosubmit{
  display:flex;gap:9px;align-items:flex-start;margin:0 18px 12px;padding:9px 11px;
  border:1px solid color-mix(in srgb,var(--bin-phrase) 40%,var(--rule));
  border-radius:3px;background:color-mix(in srgb,var(--bin-phrase) 10%,var(--panel));
  line-height:1.5;
}
.nosubmit svg{flex:0 0 auto;color:var(--bin-phrase);margin-top:1px}
.nosubmit b{font-weight:600}
.prompt{margin:0 18px 12px}
.prompt summary{cursor:pointer;padding:4px 0}
.prompt summary:hover{color:var(--ink-2)}
.prompt textarea{margin-top:6px}
.prompt textarea{
  width:100%;height:132px;resize:vertical;padding:9px 10px;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;
  font-family:var(--font-mono);font-size:var(--fs-label);line-height:1.6;
}
.prompt .row{display:flex;align-items:center;gap:10px;padding-top:7px}
.copy{padding:5px 11px;border:1px solid var(--rule);border-radius:3px;
  background:var(--panel-2);font-family:var(--font-mono);font-size:var(--fs-label);
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.copy:hover{background:var(--panel-3);color:var(--ink)}
.packet table{margin-bottom:6px}
.packet td{font-size:var(--fs-label);font-family:var(--font-mono)}
.packet td.lab{font-family:var(--font-ui);font-size:var(--fs-data);color:var(--ink)}
.st-filled{color:var(--bin-pass)} .st-unanswered{color:var(--bin-stale)}
.st-skipped{color:var(--ink-3)} .st-review{color:var(--bin-phrase)}
.req{color:var(--bin-phrase)}
.act svg{flex:0 0 auto}
.saved{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.07em;
  text-transform:uppercase;color:var(--bin-pass);opacity:0;transition:opacity 180ms ease}
.saved.on{opacity:1}

.note{padding:14px 18px;border-bottom:1px solid var(--rule)}
.note textarea{
  width:100%;min-height:62px;resize:vertical;padding:9px 10px;margin-top:6px;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;
  font-family:var(--font-ui);line-height:1.5;
}
.note textarea::placeholder{color:var(--ink-3)}
.note textarea:focus{border-color:var(--sel);outline:none;box-shadow:0 0 0 3px var(--sel-wash)}

.body{padding:16px 18px}
.body h2{margin:22px 0 8px}
.body .prose{
  white-space:pre-wrap;line-height:1.6;color:var(--ink-2);
  max-width:72ch;overflow-wrap:break-word;
}
.hint{margin-top:14px;padding:10px 12px;max-width:70ch;line-height:1.55;
  color:var(--ink-2);background:var(--panel);border:1px solid var(--rule);
  border-radius:3px}
.trace{list-style:none;padding-top:8px}
.trace li{display:flex;gap:12px;padding:4px 0;border-bottom:1px solid var(--rule-2);
  font-family:var(--font-mono);font-size:var(--fs-label);color:var(--ink-3)}
.trace .k{color:var(--ink-2);min-width:88px}

/* ---------- empty / loading / error ---------- */
.empty{padding:56px 28px;text-align:center;color:var(--ink-3);max-width:46ch;margin:0 auto}
.empty h2{font-size:0.9375rem;color:var(--ink-2);font-weight:600;padding-bottom:6px}
.empty p{line-height:1.6}
.empty code{font-family:var(--font-mono);color:var(--ink);background:var(--panel-3);
  padding:1px 5px;border-radius:2px}
.skel{padding:10px}
.skel i{display:block;height:11px;margin:11px 10px;border-radius:2px;
  background:linear-gradient(90deg,var(--panel-3) 0%,var(--rule-2) 50%,var(--panel-3) 100%);
  background-size:220% 100%;animation:sweep 1.3s ease-in-out infinite}
@keyframes sweep{to{background-position:-120% 0}}
.foot{display:flex;justify-content:space-between;padding:9px 14px;
  border-top:1px solid var(--rule);background:var(--panel);flex:0 0 auto}
.more{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.more:hover{color:var(--ink)}

/* ---------- source sheet ---------- */
dialog{
  border:1px solid var(--rule);border-radius:4px;padding:0;background:var(--panel-2);
  color:var(--ink);box-shadow:var(--shadow);width:min(760px,92vw);max-height:82vh;
}
dialog::backdrop{background:rgba(10,12,16,.5)}
.sheet-head{display:flex;align-items:baseline;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--rule);background:var(--panel);
  position:sticky;top:0}
.sheet-head h2{font-size:0.9375rem;font-weight:600}
.sheet-head button{margin-left:auto;color:var(--ink-2)}
.sheet-body{overflow-y:auto;max-height:calc(82vh - 52px)}
.sheet-body td,.sheet-body th{padding:6px 18px}
.st{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.06em}
.st.bad{color:var(--bin-phrase)} .st.warn{color:var(--bin-stale)} .st.ok{color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media (max-width:1000px){
  .work{grid-template-columns:1fr;grid-template-rows:minmax(220px,42%) 1fr}
  .col+.col{border-left:0;border-top:1px solid var(--rule)}
  .readout{margin-left:0;width:100%;justify-content:space-between;gap:12px}
  .readout div{text-align:left}
  #diemap{height:56px}
}
</style>
</head>
<body>
<!--
  THESIS: A job search is a yield problem — 42,391 die in, 489 out — so this
  reads as a fab yield sheet, not a job-board dashboard of cards and avatars.
  OWN-WORLD: Cleanroom gray-blue ground, graphite ink, mono numerics
  throughout, one saturated categorical bin palette carrying reject classes,
  probe-card gold reserved for the commit action. Rules, not cards.
  STORY: Andrew sees the yield and the dead probe sites first, filters by bin,
  reads one posting, and marks it shortlisted or dismissed.
  FIRST VIEWPORT: Lot header with die counts and yield at right; a full-width
  die map beneath it; bin legend doubling as the filter row; then list left,
  posting right. The gold action sits in the detail pane, never in the list.
  FORM: Semiconductor wafer bin map / yield sheet — candidate 6 of 7, seed e17728ff.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, and DESIGN.md
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-alert" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 1.8 14.9 13.6H1.1z"/><path d="M8 6.3v3.4"/><path d="M8 11.6h.01"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></g>
    <g id="i-ext" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.2 2.4h4.4v4.4"/><path d="M13.6 2.4 7.4 8.6"/>
      <path d="M12.1 9.7v3.1a1 1 0 0 1-1 1H3.2a1 1 0 0 1-1-1V4.9a1 1 0 0 1 1-1h3.1"/></g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8.4 6.2 11.8 13.2 4.4"/></g>
    <g id="i-flag" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 14V2.4"/><path d="M3.6 3.1h8.6l-1.9 3.1 1.9 3.1H3.6"/></g>
    <g id="i-x" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g>
    <g id="i-fill" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.6 3.4h10.8"/><path d="M2.6 6.9h7.2"/><path d="M2.6 10.4h4.4"/>
      <path d="M10.1 13.4l1.9-1.9 2.4 2.4-1.9 1.9z"/></g>
    <g id="i-refresh" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.7 6.8A5.9 5.9 0 0 0 3.4 5.2"/><path d="M2.3 9.2a5.9 5.9 0 0 0 10.3 1.6"/>
      <path d="M3.1 2.2v3h3"/><path d="M12.9 13.8v-3h-3"/></g>
  </defs>
</svg>

<header class="lot">
  <div class="lot-top">
    <div class="lot-id">LOT <span id="lot-date">————</span></div>
    <button class="runbtn" id="poll" title="Poll every source now (about 3 minutes)">
      <svg width="15" height="15" aria-hidden="true"><use href="#i-refresh"/></svg>
      <span id="poll-label">Run poll</span>
    </button>
    <span class="lbl" id="poll-status"></span>
    <div class="readout">
      <div><span class="lbl">Die in</span><b id="r-total">—</b></div>
      <div><span class="lbl">Binned out</span><b id="r-reject">—</b></div>
      <div><span class="lbl">Pass</span><b id="r-pass">—</b></div>
      <div class="yield"><span class="lbl">Yield</span><b id="r-yield">—</b></div>
      <div><span class="lbl">New 24h</span><b id="r-fresh">—</b></div>
    </div>
  </div>
  <div class="map-row">
    <div class="map-wrap">
      <canvas id="diemap" role="img"
        aria-label="Die map: every open posting placed in its bin, one cell per group of postings."></canvas>
      <div class="map-cap">
        <span class="lbl" id="map-scale">—</span>
        <span class="lbl" id="map-hover">hover a cell to read its bin</span>
      </div>
    </div>
  </div>
  <nav class="bins" id="bins" aria-label="Filter by bin"></nav>
</header>

<div class="alerts" id="alerts" hidden>
  <svg width="16" height="16" aria-hidden="true"><use href="#i-alert"/></svg>
  <b id="alert-n"></b>
  <span class="sites" id="alert-sites"></span>
  <button id="open-sources">Open probe log</button>
</div>

<main class="work">
  <section class="col" aria-label="Postings">
    <div class="toolbar">
      <label class="search">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Filter by company, title, or location"
               aria-label="Filter postings" autocomplete="off">
      </label>
      <button class="toggle" id="fresh" aria-pressed="false"
              title="Only postings first seen in the last 24 hours">New only</button>
      <select class="toggle" id="status" aria-label="Triage state">
        <option value="all">All states</option>
        <option value="discovered">Untriaged</option>
        <option value="shortlisted">Shortlisted</option>
        <option value="submitted">Applied</option>
        <option value="dismissed">Dismissed</option>
      </select>
    </div>
    <div class="scroll" id="list-scroll">
      <div class="skel" id="list-skel"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <table id="table" hidden>
        <thead><tr>
          <th scope="col">Company</th><th scope="col">Title</th>
          <th scope="col" class="num"><button type="button" id="sort-age"
              class="sortbtn" aria-pressed="false"
              title="Sort by newest first. Click again to sort by fit score."
              >Age</button></th>
          <th scope="col" class="num">State</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="list-empty" hidden></div>
    </div>
    <div class="foot">
      <span class="lbl" id="count">—</span>
      <button class="more lbl" id="more" hidden>Load more</button>
    </div>
  </section>

  <section class="col" aria-label="Posting detail">
    <div class="scroll" id="detail-scroll">
      <div class="empty" id="detail-empty">
        <h2>No die selected</h2>
        <p>Pick a row to read the full posting, mark it, and keep a note. The bin
           legend above filters the list; <code>PASS</code> is the shortlist.</p>
      </div>
      <div class="detail" id="detail" hidden></div>
    </div>
  </section>
</main>

<dialog id="sources">
  <div class="sheet-head">
    <h2>Probe log</h2>
    <span class="lbl" id="sheet-sub"></span>
    <button id="close-sources" aria-label="Close probe log">
      <svg width="16" height="16" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <table><thead><tr>
      <th scope="col">Source</th><th scope="col">Status</th>
      <th scope="col" class="num">Rows</th><th scope="col" class="num">New</th>
      <th scope="col" class="num">ms</th><th scope="col">Last run</th>
    </tr></thead><tbody id="source-rows"></tbody></table>
  </div>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const BIN_VAR = {pass:"--bin-pass",title:"--bin-title",location:"--bin-location",
  experience:"--bin-experience",phrase:"--bin-phrase",grad:"--bin-grad",
  stale:"--bin-stale",ghost:"--bin-ghost",unbinned:"--bin-unbinned",
  internship:"--bin-internship",references:"--bin-references",
  // Feature 19. Triage tabs are a different taxonomy from the reject bins, so
  // they borrow no bin colour; ink tones say "not a bin" and follow the theme.
  applied:"--ink-2", passed:"--ink-3"};
const STATE_FLAG = {shortlisted:["short","SHORTLIST"],submitted:["sub","APPLIED"],
  dismissed:["dis","PASSED"]};

const state = {bin:"pass", q:"", fresh:false, status:"all", sort:"score",
               offset:0, limit:120, jobs:[], selected:null, summary:null, noteTimer:null};

const nf = new Intl.NumberFormat("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ageDays(iso){
  if(!iso) return null;
  const t = Date.parse(iso);
  return Number.isNaN(t) ? null : Math.floor((Date.now()-t)/86400000);
}
// Hours under a day. Being early is the thesis, so a two-hour-old posting and
// a twenty-two-hour-old one must not both read "0d".
function ageText(iso){
  if(!iso) return "—";
  const t = Date.parse(iso);
  if(Number.isNaN(t)) return "—";
  const hours = (Date.now()-t)/3600000;
  if(hours < 0) return "0h";
  if(hours < 1) return "<1h";
  if(hours < 24) return Math.floor(hours)+"h";
  return Math.floor(hours/24)+"d";
}

/* Feature 20. The hosted copy (Vercel) injects this. It has no laptop behind
   it: no Auto Apply, no local poll thread, and seen_count is only refreshed
   when a row changes, so the pieces that depend on those are hidden. */
const HOSTED = !!window.JOBPIPE_HOSTED;

async function api(path, opts){
  const res = await fetch(path, opts);
  if(!res.ok){
    let msg = res.status+" "+res.statusText;
    try{ const j = await res.json(); if(j.error) msg = j.error; }catch{}
    throw new Error(msg);
  }
  return res.json();
}

function fatal(where, err){
  const box = $(where);
  box.hidden = false;
  box.innerHTML = `<h2>Cannot reach the ${HOSTED ? "" : "local "}server</h2>
    <p>${esc(err.message)}</p>
    <p>Restart it with <code>python jobs.py serve</code> in the project folder,
       then reload this page.</p>`;
}

/* ---------- summary, readout, bins, die map ---------- */
async function loadSummary(){
  let s;
  try{ s = await api("/api/summary"); }
  catch(err){ fatal("list-empty", err); $("list-skel").hidden = true; return; }
  state.summary = s;

  const rejected = s.open - s.passed;
  $("lot-date").textContent = (s.last_run || "").slice(0,10) || "no poll yet";
  $("r-total").textContent  = nf.format(s.open);
  $("r-reject").textContent = nf.format(rejected);
  $("r-pass").textContent   = nf.format(s.passed);
  $("r-yield").textContent  = s.yield_pct.toFixed(2)+"%";
  $("r-fresh").textContent  = nf.format(s.fresh);

  const bins = $("bins");
  bins.innerHTML = "";
  const all = document.createElement("button");
  all.className = "bin"; all.dataset.bin = "all";
  all.setAttribute("aria-pressed", String(state.bin === "all"));
  all.innerHTML = `<span class="bin-n">${nf.format(s.open)}</span>
    <span class="bin-l">ALL DIE</span>`;
  bins.append(all);
  let sawTriage = false;
  for(const b of s.bins){
    // A triage tab is shown even at zero: "nothing applied to yet" is the
    // answer to a question worth asking, where an empty reject bin is not.
    if(!b.count && b.kind !== "triage") continue;
    if(b.kind === "triage" && !sawTriage){
      sawTriage = true;
      const sep = document.createElement("span");
      sep.className = "bin-sep"; sep.setAttribute("aria-hidden","true");
      bins.append(sep);
    }
    const el = document.createElement("button");
    el.className = "bin"; el.dataset.bin = b.key;
    el.dataset.kind = b.kind || "tier1";
    el.setAttribute("aria-pressed", String(state.bin === b.key));
    const chip = b.kind === "triage"
      ? `<span class="chip" style="border-color:var(${BIN_VAR[b.key]})"></span>`
      : `<span class="chip" style="background:var(${BIN_VAR[b.key]||"--bin-unbinned"})"></span>`;
    el.innerHTML = `${chip}
      <span class="bin-n">${nf.format(b.count)}</span>
      <span class="bin-l">${esc(b.label)}</span>`;
    bins.append(el);
  }
  bins.onclick = (e) => {
    const btn = e.target.closest(".bin");
    if(btn) setBin(btn.dataset.bin);
  };

  const alerts = s.alerts || [];
  if(alerts.length){
    $("alerts").hidden = false;
    $("alert-n").textContent = alerts.length+
      (alerts.length===1 ? " probe site down" : " probe sites down");
    $("alert-sites").textContent = alerts.map((a)=>a.source).join("  ·  ");
  }
  drawMap();
}

/* One cell per N postings, laid out in bin order. Area is the message: the
   PASS band is meant to look as thin as 1.2% actually is. */
let mapCells = [];
function drawMap(){
  const s = state.summary; if(!s) return;
  const cv = $("diemap"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const cell = 6, gap = 2, step = cell+gap;
  const cols = Math.max(1, Math.floor((w+gap)/step));
  const rows = Math.max(1, Math.floor((h+gap)/step));
  const slots = cols*rows;
  const per = Math.max(1, Math.ceil(s.open/slots));
  $("map-scale").textContent = "1 cell = "+nf.format(per)+
    (per===1 ? " posting" : " postings");

  const css = getComputedStyle(document.documentElement);
  mapCells = [];
  let i = 0;
  for(const b of s.bins){
    const n = Math.round(b.count/per);
    const color = css.getPropertyValue(BIN_VAR[b.key]||"--bin-unbinned").trim();
    // Rejects are the ground, not the subject. At 87% title-rejects, drawing
    // every bin at full chroma buries the 1.2% that matters under a slab.
    ctx.globalAlpha = b.key === "pass" ? 1 : 0.5;
    for(let k=0; k<n && i<slots; k++, i++){
      const x = (i%cols)*step, y = Math.floor(i/cols)*step;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, cell, cell);
      mapCells.push({x, y, bin:b.key, label:b.label, count:b.count});
    }
    ctx.globalAlpha = 1;
  }
  const rule = css.getPropertyValue("--rule-2").trim();
  for(; i<slots; i++){
    const x = (i%cols)*step, y = Math.floor(i/cols)*step;
    ctx.fillStyle = rule; ctx.fillRect(x, y, cell, cell);
  }
}

function cellAt(ev){
  const r = $("diemap").getBoundingClientRect();
  const x = ev.clientX-r.left, y = ev.clientY-r.top;
  return mapCells.find((c)=> x>=c.x && x<=c.x+7 && y>=c.y && y<=c.y+7) || null;
}
$("diemap").addEventListener("mousemove",(ev)=>{
  const c = cellAt(ev);
  $("map-hover").textContent = c
    ? c.label+": "+nf.format(c.count)+" postings"
    : "hover a cell to read its bin";
});
$("diemap").addEventListener("mouseleave",()=>{
  $("map-hover").textContent = "hover a cell to read its bin";
});
$("diemap").addEventListener("click",(ev)=>{ const c = cellAt(ev); if(c) setBin(c.bin); });
addEventListener("resize", drawMap);

/* ---------- list ---------- */
function setBin(bin){
  state.bin = bin; state.offset = 0;
  for(const el of document.querySelectorAll(".bin"))
    el.setAttribute("aria-pressed", String(el.dataset.bin === bin));
  loadJobs();
}

async function loadJobs(append){
  if(!append){ state.offset = 0; $("list-skel").hidden = false; $("table").hidden = true; }
  $("list-empty").hidden = true;
  const p = new URLSearchParams({bin:state.bin, q:state.q, status:state.status,
    sort:state.sort, limit:String(state.limit), offset:String(state.offset)});
  if(state.fresh) p.set("fresh","1");

  let data;
  try{ data = await api("/api/jobs?"+p); }
  catch(err){ $("list-skel").hidden = true; fatal("list-empty", err); return; }

  state.jobs = append ? state.jobs.concat(data.jobs) : data.jobs;
  $("list-skel").hidden = true;
  renderRows(data.total);
}

function renderRows(total){
  const tb = $("rows");
  tb.innerHTML = "";
  if(!state.jobs.length){
    $("table").hidden = true;
    const e = $("list-empty"); e.hidden = false;
    const label = state.bin === "pass" ? "the PASS bin" : "this bin";
    // A triage tab fills up from the buttons on a posting, not from a poll, so
    // telling someone to run `ingest` here would send them the wrong way.
    const triage = (state.summary?.bins || [])
      .find((b) => b.key === state.bin && b.kind === "triage");
    e.innerHTML = state.q || state.fresh || state.status !== "all"
      ? `<h2>Nothing matches those filters</h2>
         <p>Clear the search or switch bins. ${nf.format(total)} postings sit in ${label} unfiltered.</p>`
      : triage
      ? (state.bin === "applied"
        ? `<h2>Nothing applied to yet</h2>
           <p>Open a posting in <b>PASS</b> and mark it <b>Applied</b>. It moves here,
              and leaves the shortlist so it stops competing for attention tomorrow.</p>`
        : `<h2>Nothing passed on yet</h2>
           <p>Marking a posting <b>Pass</b> moves it here and out of the shortlist.
              Nothing is deleted, so you can always take one back.</p>`)
      : `<h2>This bin is empty</h2>
         <p>Run <code>python jobs.py ingest</code> to poll for postings, then reload.</p>`;
    $("count").textContent = "0 of "+nf.format(total);
    $("more").hidden = true;
    return;
  }

  const frag = document.createDocumentFragment();
  for(const j of state.jobs){
    const tr = document.createElement("tr");
    tr.dataset.id = j.job_id;
    tr.tabIndex = 0;
    tr.setAttribute("aria-selected", String(state.selected === j.job_id));
    if(j.status === "dismissed") tr.className = "dismissed";

    const flags = [];
    if(j.seen_count === 1) flags.push('<span class="flag new">NEW</span>');
    if(j.repost_count > 1) flags.push(`<span class="flag ghost">×${j.repost_count}</span>`);
    const sf = STATE_FLAG[j.status];
    if(sf) flags.push(`<span class="flag ${sf[0]}">${sf[1]}</span>`);

    tr.innerHTML =
      `<td class="co">${esc(j.company)}</td>
       <td class="ti"><span class="t">${esc(j.title)}</span>
         <span class="l">${esc(j.location || "location not stated")}</span></td>
       <td class="num age">${ageText(j.posted_at)}</td>
       <td class="num"><span class="flags">${flags.join("")}</span></td>`;
    frag.append(tr);
  }
  tb.append(frag);
  $("table").hidden = false;
  $("count").textContent = nf.format(state.jobs.length)+" of "+nf.format(total)+" shown";
  $("more").hidden = state.jobs.length >= total;
}

$("rows").addEventListener("click",(e)=>{
  const tr = e.target.closest("tr"); if(tr) select(tr.dataset.id);
});
$("rows").addEventListener("keydown",(e)=>{
  const tr = e.target.closest("tr"); if(!tr) return;
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); select(tr.dataset.id); }
  if(e.key === "ArrowDown" && tr.nextElementSibling){ e.preventDefault(); tr.nextElementSibling.focus(); }
  if(e.key === "ArrowUp" && tr.previousElementSibling){ e.preventDefault(); tr.previousElementSibling.focus(); }
});
$("more").addEventListener("click",()=>{
  state.offset += state.limit; loadJobs(true);
});
$("q").addEventListener("input",(e)=>{
  clearTimeout(state.qTimer);
  state.qTimer = setTimeout(()=>{ state.q = e.target.value.trim(); loadJobs(); }, 180);
});
$("fresh").addEventListener("click",(e)=>{
  state.fresh = !state.fresh;
  e.currentTarget.setAttribute("aria-pressed", String(state.fresh));
  loadJobs();
});
$("status").addEventListener("change",(e)=>{ state.status = e.target.value; loadJobs(); });
// Feature 18. Age and fit score are the only two orders that mean anything
// here, so one control toggles between them rather than a menu of columns.
$("sort-age").addEventListener("click",(e)=>{
  state.sort = state.sort === "age" ? "score" : "age";
  e.currentTarget.setAttribute("aria-pressed", String(state.sort === "age"));
  loadJobs();
});

/* ---------- detail ---------- */
async function select(id){
  state.selected = id;
  for(const tr of document.querySelectorAll("#rows tr"))
    tr.setAttribute("aria-selected", String(tr.dataset.id === id));

  $("detail-empty").hidden = true;
  const box = $("detail");
  box.hidden = false;
  box.innerHTML = `<div class="skel"><i></i><i></i><i></i><i></i></div>`;
  $("detail-scroll").scrollTop = 0;

  let j;
  try{ j = await api("/api/job/"+encodeURIComponent(id)); }
  catch(err){
    box.innerHTML = `<div class="empty"><h2>Could not load that posting</h2>
      <p>${esc(err.message)}</p></div>`;
    return;
  }
  renderDetail(j);
}

function renderDetail(j){
  const meta = [
    ["Location", j.location || "not stated"],
    ["Source", j.ats_vendor],
    ["Posted", j.posted_at
      ? j.posted_at.slice(0,10)+" ("+ageText(j.posted_at)+")" : "not stated"],
    ["First seen", (j.first_seen_at||"").slice(0,10)],
    ...(HOSTED ? [] : [["Polls seen", j.seen_count]]),
    ["Bin", j.filter_verdict === "pass" ? "PASS" : (j.filter_reason || "unbinned")],
    ["Fit score", j.fit_score ?? "not scored yet"],
  ];
  // On aggregator rows `department` holds the ATS the posting actually lives on,
  // not a team. Labelling it "Team" put a wrong fact on screen.
  if(j.department) meta.splice(2, 0,
    [j.ats_vendor === "simplify" ? "Hosted on" : "Team", j.department]);
  if(j.employment_type) meta.splice(2, 0, ["Type", j.employment_type]);
  if(j.repost_count) meta.push(["Reposts", j.repost_count+" (ghost risk)"]);

  const dup = j.canonical
    ? `<p class="lbl" style="padding-top:10px">Duplicate of the ${esc(j.canonical.ats_vendor)} listing.
       <a href="${esc(j.canonical.url)}" target="_blank" rel="noopener">Open the canonical posting</a></p>`
    : (j.also_seen && j.also_seen.length
        ? `<p class="lbl" style="padding-top:10px">Also seen on ${
             j.also_seen.map((d)=>esc(d.ats_vendor)).join(", ")}</p>` : "");

  const st = j.status || "discovered";
  $("detail").innerHTML = `
    <div class="detail-head">
      <div class="co">${esc(j.company)}</div>
      <h1>${esc(j.title)}</h1>
      <div class="meta">${meta.map(([k,v])=>
        `<div><span class="lbl">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>
      ${dup}
    </div>
    <div class="acts">
      <a class="act go" href="${esc(j.apply_url || j.url)}" target="_blank" rel="noopener">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-ext"/></svg>Open posting</a>
      ${HOSTED ? "" : `<button class="act autoapply" id="autoapply">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-fill"/></svg>Auto Apply</button>`}
      <button class="act" data-set="shortlisted" aria-pressed="${st==="shortlisted"}">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-flag"/></svg>Shortlist</button>
      <button class="act" data-set="submitted" aria-pressed="${st==="submitted"}">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-check"/></svg>Applied</button>
      <button class="act" data-set="dismissed" aria-pressed="${st==="dismissed"}">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-x"/></svg>Pass</button>
      <span class="saved" id="saved">saved</span>
    </div>
    <div id="packet"></div>
    <div class="note">
      <label class="lbl" for="note-box">Note</label>
      <textarea id="note-box" placeholder="Why this one. Referral path, the hook, who to ask."
        >${esc(j.notes || "")}</textarea>
    </div>
    <div class="body">
      <h2 class="lbl">Posting</h2>
      <div class="prose">${esc(j.description_text || "").trim() ||
        "This source ships no description. Open the posting to read it."}</div>
      ${j.ats_vendor === "simplify" ? `<p class="hint">Aggregator row. The list
        carries no description, so open the posting for the real text. Tier-2 will
        fetch it from ${esc(j.department || "the source ATS")} once scoring ships.</p>` : ""}
      ${j.events && j.events.length ? `<h2 class="lbl">History</h2>
        <ul class="trace">${j.events.map((e)=>
          `<li><span class="k">${esc(e.kind)}</span><span>${esc((e.at||"").replace("T"," ").slice(0,16))}</span>
           <span>${esc(e.detail||"")}</span></li>`).join("")}</ul>` : ""}
    </div>`;

  for(const btn of document.querySelectorAll(".act[data-set]")){
    btn.addEventListener("click", async () => {
      const next = btn.getAttribute("aria-pressed") === "true"
        ? "discovered" : btn.dataset.set;
      await saveTriage(j.job_id, {status: next});
      for(const b of document.querySelectorAll(".act[data-set]"))
        b.setAttribute("aria-pressed", String(b.dataset.set === next));
      const row = state.jobs.find((x)=>x.job_id === j.job_id);
      if(row) row.status = next;
      // Feature 19: applying to a job takes it out of PASS, so the list it is
      // standing in and the tab counts both have to catch up. The detail pane
      // stays put, so you can still read what you just filed.
      await Promise.all([loadSummary(), loadJobs()]);
    });
  }
  /* Auto Apply. The page opens the form and prepares the answers; it cannot
     type into another origin, so Claude in Chrome does the filling. */
  $("autoapply")?.addEventListener("click", async () => {
    const box = $("packet");
    box.innerHTML = `<div class="packet"><div class="skel"><i></i><i></i><i></i></div></div>`;

    let p;
    try{
      // Park the job first, so the extension already has something to read by
      // the time the form's content script boots.
      await api("/api/apply/pending", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({job_id: j.job_id})});
      p = await api("/api/job/"+encodeURIComponent(j.job_id)+"/fillpacket");
    }catch(err){
      box.innerHTML = `<div class="packet"><div class="empty">
        <h2>Could not build the fill packet</h2><p>${esc(err.message)}</p></div></div>`;
      return;
    }

    const target = p.apply_url || j.apply_url || j.url;
    if(target) window.open(target, "_blank", "noopener");
    renderPacket(p);
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  });

  const note = $("note-box");
  note.addEventListener("input", () => {
    clearTimeout(state.noteTimer);
    state.noteTimer = setTimeout(
      () => saveTriage(j.job_id, {note: note.value}), 600);
  });
}

function renderPacket(p){
  const c = p.counts;
  const rows = p.fields.map((f) => `
    <tr>
      <td class="lab">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</td>
      <td class="st-${f.status}">${f.status}</td>
      <td>${esc(f.value === null || f.value === undefined ? "" : String(f.value))}</td>
      <td style="color:var(--ink-3)">${esc(f.note || "")}</td>
    </tr>`).join("");

  const sourceNote = p.source === "api"
    ? "Fields read from the Greenhouse application API."
    : "This ATS publishes no field list, so these are the answers to match "
      + "against labels on the rendered page.";

  $("packet").innerHTML = `
    <div class="packet">
      <div class="packet-head">
        <h2>Fill packet</h2>
        <span class="lbl">${esc(sourceNote)}</span>
        <span class="tally">
          <span class="t-filled">${c.filled} filled</span>
          <span class="t-open">${c.unanswered} unanswered</span>
          ${c.review ? `<span class="t-review">${c.review} need a look</span>` : ""}
          ${c.skipped ? `<span class="t-skip">${c.skipped} skipped</span>` : ""}
          ${c.required_unanswered
            ? `<span class="t-review">${c.required_unanswered} required still blank</span>`
            : ""}
        </span>
      </div>
      <div class="nosubmit">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-alert"/></svg>
        <div><b>Nothing here submits.</b> The form opened in a new tab and the
        extension is filling it now. Attach the resume yourself — browsers do not
        let an extension set a file input. Then read it and submit.</div>
      </div>
      <details class="prompt">
        <summary class="lbl">Manual fallback, if the extension is not loaded</summary>
        <textarea id="prompt-box" readonly>${esc(p.instructions)}</textarea>
        <div class="row">
          <button class="copy" id="copy-prompt">Copy prompt</button>
          <span class="lbl" id="copy-done"></span>
        </div>
      </details>
      ${p.error ? `<div class="nosubmit"><svg width="16" height="16"><use href="#i-alert"/></svg>
        <div>${esc(p.error)}</div></div>` : ""}
      <table>
        <thead><tr><th>Field</th><th>Status</th><th>Value</th><th>Note</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  $("copy-prompt").addEventListener("click", async () => {
    const text = $("prompt-box").value;
    try{
      await navigator.clipboard.writeText(text);
      $("copy-done").textContent = "copied";
    }catch{
      // Clipboard access can be blocked; selecting the text still works.
      $("prompt-box").select();
      $("copy-done").textContent = "selected — press ctrl+c";
    }
    setTimeout(() => { $("copy-done").textContent = ""; }, 2500);
  });
}

async function saveTriage(id, payload){
  try{
    await api("/api/job/"+encodeURIComponent(id)+"/triage",
      {method:"POST", headers:{"Content-Type":"application/json"},
       body: JSON.stringify(payload)});
    const el = $("saved");
    if(el){ el.classList.add("on"); setTimeout(()=>el.classList.remove("on"), 1400); }
  }catch(err){
    const el = $("saved");
    if(el){ el.textContent = "not saved: "+err.message;
            el.style.color = "var(--bin-phrase)"; el.classList.add("on"); }
  }
}

/* ---------- probe log ---------- */
$("open-sources").addEventListener("click", async () => {
  const dlg = $("sources");
  dlg.showModal();
  const tb = $("source-rows");
  tb.innerHTML = `<tr><td colspan="6"><div class="skel"><i></i><i></i><i></i></div></td></tr>`;
  let data;
  try{ data = await api("/api/sources"); }
  catch(err){
    tb.innerHTML = `<tr><td colspan="6"><div class="empty"><h2>Could not read the probe log</h2>
      <p>${esc(err.message)}</p></div></td></tr>`;
    return;
  }
  const bad = new Set(data.alerts.map((a)=>a.source));
  $("sheet-sub").textContent = data.sources.length+" sources · "+
    data.alerts.length+" alerting";
  tb.innerHTML = data.sources.map((s)=>{
    const cls = !s.ok ? "bad" : (bad.has(s.source_key) ? "warn" : "ok");
    const txt = !s.ok ? "FAIL "+(s.http_status||"") :
      (s.fetched === 0 ? "EMPTY 200" : "OK");
    return `<tr><td class="mono">${esc(s.source_key)}</td>
      <td class="st ${cls}">${esc(txt)}</td>
      <td class="num mono">${nf.format(s.fetched)}</td>
      <td class="num mono">${nf.format(s.inserted)}</td>
      <td class="num mono">${nf.format(s.duration_ms)}</td>
      <td class="mono">${esc((s.run_at||"").replace("T"," ").slice(0,16))}</td></tr>`;
  }).join("");
});
$("close-sources").addEventListener("click", () => $("sources").close());

/* ---------- run a poll from the page ---------- */
/* A full poll takes about three minutes, so it runs server-side in a thread and
   this only watches. The scheduled task may also be mid-run; the server reports
   its own state and the DB has a busy timeout, so the two can overlap. */
let pollTimer = null;

function renderPoll(s){
  const btn = $("poll"), label = $("poll-label"), status = $("poll-status");
  status.classList.remove("done", "bad");
  if(s.hosted){
    // Polls run on GitHub Actions every 4 hours; a click can only queue one.
    btn.disabled = !s.can_dispatch;
    btn.classList.remove("busy");
    label.textContent = "Run poll";
    btn.title = s.can_dispatch ? "Queue a poll on GitHub Actions (about 5 minutes)"
                               : "Polls run on GitHub Actions every 4 hours";
    status.textContent = s.message
      || (s.last_run ? `polled ${ageText(s.last_run)} ago · every 4h` : "no poll yet");
    if(s.message) status.classList.add(s.started ? "done" : "bad");
    return;
  }
  if(s.running){
    btn.disabled = true;
    btn.classList.add("busy");
    label.textContent = "Polling";
    const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    status.textContent = s.source === "deduplicating" || s.source === "filtering"
      ? s.source
      : `${s.done}/${s.total || "?"} sources · ${pct}% · ${nf.format(s.new)} new`;
    return;
  }
  btn.disabled = false;
  btn.classList.remove("busy");
  label.textContent = "Run poll";
  if(s.error){
    status.textContent = "poll failed: "+s.error;
    status.classList.add("bad");
  }else if(s.finished_at){
    status.textContent = `${nf.format(s.new)} new · ${nf.format(s.closed)} closed`
      + (s.failed ? ` · ${s.failed} sources failed` : "");
    status.classList.add(s.failed ? "bad" : "done");
  }else{
    status.textContent = "";
  }
}

function watchPoll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    let s;
    try{ s = await api("/api/poll"); }
    catch{ return; }   // a dropped tick is not worth surfacing; the next one retries
    renderPoll(s);
    if(!s.running){
      clearInterval(pollTimer);
      pollTimer = null;
      await loadSummary();
      await loadJobs();
    }
  }, 2000);
}

$("poll").addEventListener("click", async () => {
  renderPoll({running:true, done:0, total:0, new:0});
  try{
    const s = await api("/api/poll", {method:"POST"});
    renderPoll(s);
    if(!s.hosted) watchPoll();
  }catch(err){
    // 409 means the scheduled task or another tab already has one going.
    $("poll-status").textContent = err.message;
    $("poll-status").classList.add("bad");
    $("poll").disabled = false;
    $("poll").classList.remove("busy");
    $("poll-label").textContent = "Run poll";
    if(!HOSTED) watchPoll();
  }
});

addEventListener("keydown",(e)=>{
  if(e.key === "/" && document.activeElement !== $("q")){ e.preventDefault(); $("q").focus(); }
  if(e.key === "r" && !e.metaKey && !e.ctrlKey &&
     !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
    e.preventDefault(); $("poll").click();
  }
});

loadSummary().then(loadJobs);
// The scheduled task may be mid-poll when the page opens; show that immediately
// rather than offering a button that will just 409.
api("/api/poll").then((s) => { renderPoll(s); if(s.running) watchPoll(); }).catch(() => {});
</script>
