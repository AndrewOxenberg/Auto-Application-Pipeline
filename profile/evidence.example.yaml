# Copy this to evidence.yaml and replace it with your own record.
#
#   cp profile/evidence.example.yaml profile/evidence.yaml
#
# Every accomplishment you have, as an atomic, tagged, verifiable record. This
# is the file that makes generated material safe: scoring and resume tailoring
# may only cite an `id` that exists here, so a claim with no record behind it
# cannot reach a document you send under your own name.
#
# Rules for writing entries:
#   - One accomplishment per record. If it needs "and", it is probably two.
#   - `claim` is the sentence that could appear on a resume, as written.
#   - `verified: true` means you can walk an interviewer through it line by
#     line. If you cannot, it does not belong here.
#   - `tags` drive resume-variant selection, so use them consistently.
#   - Numbers belong in `metrics` as well as the prose, so tailoring can
#     surface them without inventing them.

- id: example-realtime-system
  org: Personal Project
  role: Lead Developer
  period: "2026-01 – present"
  tags: [systems, python, realtime, testing, backend]
  claim: >
    Built a real-time data pipeline in Python and FastAPI ingesting 50-80
    events per second across 100+ tracked sources, growing it to 300+ passing
    tests across 20+ shipped features.
  metrics:
    events_per_sec: "50-80"
    sources: "100+"
    tests: "300+"
  verified: true

